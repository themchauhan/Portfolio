<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2048px;height:1152px;background:#f4f1ec;font-family:Inter,sans-serif;color:#111;position:relative;overflow:hidden}
.text{position:absolute;left:300px;top:50%;transform:translateY(-50%);width:900px}
.eyebrow{font-size:40px;font-weight:600;color:#ff5a1f}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:112px;line-height:1;letter-spacing:-.02em;margin-top:24px}
h1 span{text-decoration:underline;text-decoration-color:#ff5a1f;text-decoration-thickness:12px;text-underline-offset:16px}
.sub{font-size:40px;line-height:1.35;margin-top:40px;color:#444;max-width:860px}
.pic{position:absolute;right:300px;top:50%;transform:translateY(-50%);width:520px;height:650px}
.pic::before{content:"";position:absolute;inset:0;transform:translate(24px,24px);background:#ff5a1f;border-radius:44px}
.pic img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:44px}
</style></head><body>
<div class="text">
  <p class="eyebrow">Manish Chauhan · Full stack developer</p>
  <h1>Software businesses <span>actually use.</span></h1>
  <p class="sub">Websites, web apps and automation. ClinicOs, RentCorp and CafeCorp. Weekend AI classes for students.</p>
</div>
<div class="pic"><img src="portrait.jpg"></div>
</body></html>
