<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#f4f1ec;color:#111;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:radial-gradient(#111 2px,transparent 2.5px);background-size:44px 44px;opacity:.06}
.wrap{position:absolute;inset:72px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:#ffe1d3;color:#a3360c;border-radius:999px;padding:12px 22px;font-size:24px;font-weight:700;letter-spacing:.08em}
.logo{display:flex;align-items:center;gap:16px;font-family:'Bricolage Grotesque';font-weight:800;font-size:44px;letter-spacing:-.01em}.logo b{color:#ff5a1f}
.kind{font-family:'JetBrains Mono';font-size:22px;letter-spacing:.12em;color:#6b645c}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:92px;line-height:.98;letter-spacing:-.025em;margin-top:44px;max-width:900px}
h1 span{text-decoration:underline;text-decoration-color:#ff5a1f;text-decoration-thickness:9px;text-underline-offset:10px}
.row{margin-top:auto;display:grid;grid-template-columns:1fr 330px;gap:44px;align-items:end}
.svc{font-size:27px;font-weight:700;color:#ff5a1f;white-space:nowrap}
hr{border:0;border-top:2px solid rgba(17,17,17,.15);margin:30px 0}
.q{font-size:32px;font-weight:500;color:#333;line-height:1.3}
.talk{display:inline-block;margin-top:20px;background:#111;color:#fff;border-radius:999px;padding:16px 34px;font-family:'Bricolage Grotesque';font-weight:800;font-size:44px}
.url{margin-top:22px;font-size:26px;font-weight:600;color:#6b645c}
.photo{position:relative;width:330px;height:420px}
.photo::before{content:"";position:absolute;inset:0;transform:translate(16px,16px);background:#ff5a1f;border-radius:30px}
.photo img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:30px}
</style></head><body>
<div class="grid"></div>
<div class="wrap">
  <div class="top"><span class="logo"><svg width="64" height="64" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#111"/><path d="M12 35V13l12 14 12-14v10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="35.5" r="3.6" fill="#ff5a1f"/></svg><span>manish<b>.</b></span></span><span class="kind">DIGITAL SOLUTIONS</span></div>
  <h1>Building digital solutions for <span>real businesses.</span></h1>
  <div class="row">
    <div>
      <p class="svc">Websites · Web Applications · Automation</p>
      <hr>
      <p class="q">Have a business idea or a problem to solve?</p>
      <span class="talk">Let's talk.</span>
      <p class="url">themanishchauhan.in</p>
    </div>
    <div class="photo"><img src="portrait.jpg"></div>
  </div>
</div>
</body></html>
