<style>
:root{
  --bg:#E9EFF2;--ink:#16233A;--muted:#55657B;--surface:#FFFFFF;--line:#C9D3DC;
  --accent:#F2B33D;--good:#2E8B57;--bad:#C4423A;--on-strong:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622;--ink:#E6ECF4;--muted:#98A7BB;--surface:#182233;--line:#2B3A4F;
    --good:#3FA872;--bad:#D9574C;--on-strong:#0E1622;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622;--ink:#E6ECF4;--muted:#98A7BB;--surface:#182233;--line:#2B3A4F;
  --good:#3FA872;--bad:#D9574C;--on-strong:#0E1622;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.5}
main{max-width:540px;margin:0 auto;padding:28px 20px 56px}
h1,.qtext,.score,.count,.btn{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif}
h1{font-weight:800;font-size:clamp(3.2rem,15vw,5.2rem);line-height:.9;letter-spacing:-.04em;
  margin:0;display:flex;align-items:center}
.eye{display:inline-block;width:.8em;height:.8em;margin:0 .03em;transform-origin:50% 50%;
  animation:blink 3s ease-in-out .7s 1}
@keyframes blink{0%,7%,100%{transform:scaleY(1)}3.5%{transform:scaleY(.08)}}
.tag{font-size:1.05rem;color:var(--muted);margin:12px 0 4px;max-width:36ch}
.meta{font-size:.95rem;color:var(--muted);margin:0 0 18px}
.stage{position:relative;aspect-ratio:4/3;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.stage svg.scene{width:100%;height:100%;display:block}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:12px;overflow:hidden;visibility:hidden}
.bar.on{visibility:visible}
.fill{height:100%;width:100%;background:var(--accent);border-radius:99px}
.count{font-weight:800;font-size:6.5rem;line-height:1}
.cover{text-align:center;padding:20px;color:var(--muted)}
.cover svg{width:88px;height:88px;color:var(--ink)}
.cover p{margin:6px 0 0;font-size:1.1rem}
.stage.tap svg{cursor:crosshair;touch-action:manipulation}
.credit{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem}
.credit a{color:var(--ink);font-weight:700;text-underline-offset:3px}
#panel{margin-top:22px}
.lead{font-size:1.1rem;margin:0 0 6px}
.small{color:var(--muted);font-size:.95rem;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn{appearance:none;border:0;cursor:pointer;background:var(--ink);color:var(--bg);
  font-weight:600;font-size:1.1rem;padding:14px 24px;border-radius:999px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);padding:12px 22px}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.qcount{color:var(--muted);font-size:.95rem;margin:0}
.qtext{font-weight:600;font-size:1.55rem;line-height:1.2;margin:4px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{appearance:none;cursor:pointer;font:inherit;font-size:1.08rem;font-weight:700;
  padding:16px 12px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}

<body>
<main>
  <h1 aria-label="Notice">N<svg class="eye" viewBox="0 0 100 100" aria-hidden="true"><path d="M6 50 Q50 8 94 50 Q50 92 6 50 Z" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/><circle cx="50" cy="50" r="17" fill="var(--accent)"/><circle cx="50" cy="50" r="8" fill="currentColor"/></svg>tice</h1>
  <p class="tag">Look at one room for a few seconds. Then see how much you actually noticed.</p>
  <p class="meta" id="meta"></p>
  <div class="stage" id="stage"></div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <section id="panel" aria-live="polite"></section>
  <footer class="credit">Made by <a href="https://themanishchauhan.in/?utm_source=notice&amp;utm_medium=game">Manish Chauhan</a></footer>
</main>
<script>
const COLORS=[{n:'Red',h:'#D64545'},{n:'Blue',h:'#3B6FD6'},{n:'Yellow',h:'#E8B820'},{n:'Green',h:'#3E9B5A'},{n:'Purple',h:'#8A55C9'},{n:'Orange',h:'#EB7A2E'},{n:'Pink',h:'#E26FA8'}];
const CATS=[{n:'Black',h:'#2A2A2E'},{n:'Orange',h:'#E08A3C'},{n:'Grey',h:'#9AA0A8'},{n:'White',h:'#F7F7F2'}];
const WIN={sun:'A sun',moon:'A moon',rain:'Rain clouds',stars:'Stars'};
const FRAME={mountains:'Mountains',heart:'A heart',star:'A star',tree:'A tree'};
// Optional objects: each slot holds at most one, and some days a slot is empty.
const SLOTS=['wall','floor','under'];
const EXTRAS={
  lamp:{slot:'wall',label:'A lamp',name:'lamp',box:[246,102,292,214]},
  hat:{slot:'wall',label:'A hat',name:'hat',box:[262,110,308,148]},
  guitar:{slot:'wall',label:'A guitar',name:'guitar',box:[283,116,317,209]},
  dog:{slot:'floor',label:'A dog',name:'dog',box:[48,238,147,294]},
  umbrella:{slot:'floor',label:'An umbrella',name:'umbrella',box:[54,224,146,298]},
  backpack:{slot:'floor',label:'A backpack',name:'backpack',box:[72,230,124,294]},
  ball:{slot:'under',label:'A ball',name:'ball',box:[102,198,138,234]},
  slippers:{slot:'under',label:'Slippers',name:'slippers',box:[120,216,186,238]},
  basket:{slot:'under',label:'A basket',name:'basket',box:[86,196,154,236]}
};
const CORE=['A clock','A cat','A calendar','A plant','A mug','A window'];
// Tap targets (in scene coordinates) for the spot-the-change round.
const BOX={mug:[56,138,94,170],rug:[202,240,378,284],flowers:[336,128,378,190],cat:[246,212,326,264],
  apples:[166,130,224,182],books:[96,118,156,170],frame:[220,30,306,96],window:[26,24,134,122],
  clock:[148,35,202,89],cal:[323,28,379,94]};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SECS=[6,12,11,10,9,8,7];
const LAUNCH=Date.UTC(2026,10,1);

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function tools(rng){return{
  int:n=>Math.floor(rng()*n),
  pick:a=>a[Math.floor(rng()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
};}
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function puzzleNum(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-LAUNCH)/864e5)+1;}

const store={
  load(){try{return JSON.parse(localStorage.getItem('notice-v1'))||{history:{},streak:0,last:null};}catch(e){return{history:{},streak:0,last:null};}},
  save(d){try{localStorage.setItem('notice-v1',JSON.stringify(d));}catch(e){}}
};

function buildGame(seedStr){
  const T=tools(mulberry32(hashStr(seedStr)));
  const cols=T.shuffle(COLORS);
  const s={hour:1+T.int(12),min:T.pick([0,15,30,45]),mug:cols[0],rug:cols[1],flowers:cols[2],
    books:1+T.int(5),bookCols:T.shuffle(COLORS).slice(0,5),apples:1+T.int(5),
    frame:T.pick(Object.keys(FRAME)),window:T.pick(Object.keys(WIN)),cat:T.pick(CATS),cal:1+T.int(31),extras:{}};
  const inSlot=sl=>Object.keys(EXTRAS).filter(k=>EXTRAS[k].slot===sl);
  SLOTS.forEach(sl=>{s.extras[sl]=T.int(10)<6?T.pick(inSlot(sl)):null;});
  if(!SLOTS.some(sl=>s.extras[sl])){const sl=T.pick(SLOTS);s.extras[sl]=T.pick(inSlot(sl));}
  const fmt=(h,m)=>h+':'+String(m).padStart(2,'0');
  const colorQ=(text,c)=>({text,options:T.shuffle([c.n,...T.shuffle(COLORS.filter(x=>x.n!==c.n)).slice(0,3).map(x=>x.n)]),answer:c.n});
  const countQ=(text,n)=>({text,options:T.shuffle([1,2,3,4,5].filter(x=>x!==n)).slice(0,3).concat(n).sort((a,b)=>a-b).map(String),answer:String(n)});
  const builders=[
    ()=>{const a=fmt(s.hour,s.min);const set=new Set([a]);while(set.size<4)set.add(fmt(1+T.int(12),T.pick([0,15,30,45])));return{text:'What time did the clock show?',options:T.shuffle([...set]),answer:a};},
    ()=>colorQ('What color was the mug?',s.mug),
    ()=>colorQ('What color was the rug?',s.rug),
    ()=>colorQ('What color were the flowers?',s.flowers),
    ()=>countQ('How many books were on the table?',s.books),
    ()=>countQ('How many apples were in the bowl?',s.apples),
    ()=>({text:'What was in the picture on the wall?',options:T.shuffle(Object.values(FRAME)),answer:FRAME[s.frame]}),
    ()=>({text:'What could you see through the window?',options:T.shuffle(Object.values(WIN)),answer:WIN[s.window]}),
    ()=>({text:'What color was the cat?',options:T.shuffle(CATS.map(c=>c.n)),answer:s.cat.n}),
    ()=>{const set=new Set([s.cal]);while(set.size<4){const v=s.cal+T.int(11)-5;if(v>=1&&v<=31)set.add(v);}return{text:'What date was on the calendar?',options:[...set].sort((a,b)=>a-b).map(String),answer:String(s.cal)};}
  ];
  const present=SLOTS.map(sl=>s.extras[sl]).filter(Boolean);
  const absent=Object.keys(EXTRAS).filter(k=>!present.includes(k));
  const L=k=>EXTRAS[k].label;
  const presenceQ=T.int(2)
    ?()=>{const a=L(T.pick(present));return{text:'Which of these was in the room?',options:T.shuffle([a,...T.shuffle(absent).slice(0,3).map(L)]),answer:a};}
    :()=>{const a=L(T.pick(absent));const others=T.shuffle(present.map(L)).concat(T.shuffle(CORE)).slice(0,3);return{text:'Which of these was NOT in the room?',options:T.shuffle([a,...others]),answer:a};};
  const questions=T.shuffle(builders).slice(0,4).map(f=>f());
  questions.splice(T.int(5),0,presenceQ());
  return{scene:s,questions,change:makeChange(s,T)};
}

function plural(n,w){return n+' '+w+(n===1?'':'s');}
function makeChange(s,T){
  const lc=x=>x.toLowerCase();
  const color=(k,what)=>()=>{const c=T.pick(COLORS.filter(x=>x.n!==s[k].n));return{set:{[k]:c},box:BOX[k],text:`The ${what} changed from ${lc(s[k].n)} to ${lc(c.n)}.`};};
  const count=(k,what,box)=>()=>{const n=s[k]===1?2:s[k]===5?4:s[k]+(T.int(2)?1:-1);return{set:{[k]:n},box,text:`There were ${plural(s[k],what)}. Then there ${n===1?'was':'were'} ${plural(n,what)}.`};};
  const opts=[
    color('mug','mug'),color('rug','rug'),color('flowers','flowers'),
    ()=>{const c=T.pick(CATS.filter(x=>x.n!==s.cat.n));return{set:{cat:c},box:BOX.cat,text:`The cat changed from ${lc(s.cat.n)} to ${lc(c.n)}.`};},
    count('apples','apple',BOX.apples),count('books','book',BOX.books),
    ()=>{const f=T.pick(Object.keys(FRAME).filter(x=>x!==s.frame));return{set:{frame:f},box:BOX.frame,text:`The picture changed from ${lc(FRAME[s.frame])} to ${lc(FRAME[f])}.`};},
    ()=>{const w=T.pick(Object.keys(WIN).filter(x=>x!==s.window));return{set:{window:w},box:BOX.window,text:`The window changed from ${lc(WIN[s.window])} to ${lc(WIN[w])}.`};},
    ()=>{const h=(s.hour-1+3+T.int(7))%12+1;const f=(x)=>x+':'+String(s.min).padStart(2,'0');return{set:{hour:h},box:BOX.clock,text:`The clock changed from ${f(s.hour)} to ${f(h)}.`};},
    ()=>{let d;do{d=1+T.int(31);}while(d===s.cal);return{set:{cal:d},box:BOX.cal,text:`The calendar changed from ${s.cal} to ${d}.`};}
  ];
  const full=SLOTS.filter(sl=>s.extras[sl]),empty=SLOTS.filter(sl=>!s.extras[sl]);
  // Things vanishing or appearing get extra weight: they are the hardest changes to see.
  const vanish=()=>{const sl=T.pick(full),k=s.extras[sl];return{set:{extras:{...s.extras,[sl]:null}},box:EXTRAS[k].box,text:`The ${EXTRAS[k].name} disappeared.`};};
  const appear=()=>{const sl=T.pick(empty),k=T.pick(Object.keys(EXTRAS).filter(x=>EXTRAS[x].slot===sl));return{set:{extras:{...s.extras,[sl]:k}},box:EXTRAS[k].box,text:`${EXTRAS[k].label} appeared.`};};
  if(full.length)opts.push(vanish,vanish);
  if(empty.length)opts.push(appear,appear);
  const m=T.pick(opts)();
  return{scene:{...s,...m.set},box:m.box,text:m.text};
}

function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rad=i%2?r:R;p.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1));}return p.join(' ');}

// Soft contact shadow under an object (blurred ellipse).
const SH=(u,cx,cy,rx,ry,o=.24)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#1A1208" opacity="${o}" filter="url(#${u}b)"/>`;

const EXTRA_SVG={
  lamp:(u,night)=>`${SH(u,270,213,18,2.6,.3)}
    <ellipse cx="268" cy="211" rx="12" ry="3.2" fill="#2E2E33"/><ellipse cx="266" cy="210" rx="6" ry="1.2" fill="#FFFFFF" opacity=".25"/>
    <rect x="266.5" y="126" width="3" height="85" fill="#3A3A3E"/><rect x="266.8" y="126" width=".9" height="85" fill="#FFFFFF" opacity=".3"/>
    ${night?`<ellipse cx="268" cy="129" rx="15" ry="3.2" fill="#FFF6D6"/>`:''}
    <path d="M250 128 L286 128 L278 105 L258 105 Z" fill="${night?'#FFE9B8':'#F2D49B'}"/>
    <path d="M250 128 L286 128 L278 105 L258 105 Z" fill="url(#${u}sd)"/>
    <path d="M255 116 L281 116" stroke="#B08A4A" stroke-width="1" opacity=".5"/>
    <path d="M250 128 L286 128" stroke="#B08A4A" stroke-width="2" stroke-linecap="round"/>`,
  hat:(u)=>`<ellipse cx="289" cy="141" rx="18" ry="4" fill="#1A1208" opacity=".14" filter="url(#${u}b)"/>
    <circle cx="285" cy="113" r="2.6" fill="#6B4F3A"/>
    <path d="M273 136 Q271 118 285 117 Q299 118 297 136 Z" fill="#3B4A6B"/>
    <path d="M273 136 Q271 118 285 117 Q299 118 297 136 Z" fill="url(#${u}gl)"/>
    <path d="M279 121 Q285 125 291 121" stroke="#000" stroke-width="1.2" fill="none" opacity=".25"/>
    <rect x="272.5" y="129.5" width="25" height="5" fill="#D64545"/><rect x="272.5" y="129.5" width="25" height="1.2" fill="#FFFFFF" opacity=".3"/>
    <ellipse cx="285" cy="137" rx="20" ry="4.5" fill="#2F3B55"/><ellipse cx="285" cy="136" rx="17" ry="2.4" fill="#3B4A6B"/>`,
  guitar:(u)=>`${SH(u,303,209,14,2.4,.28)}
    <path d="M297 120 h10 a2 2 0 0 1 2 2 v8 h-14 v-8 a2 2 0 0 1 2 -2 z" fill="#3A2412"/>
    <circle cx="294.5" cy="123" r="1.3" fill="#D9C08A"/><circle cx="294.5" cy="127" r="1.3" fill="#D9C08A"/><circle cx="307.5" cy="123" r="1.3" fill="#D9C08A"/><circle cx="307.5" cy="127" r="1.3" fill="#D9C08A"/>
    <rect x="298" y="129" width="6" height="45" fill="#5A3A1E"/>
    <g stroke="#C9B48A" stroke-width=".8">${[136,143,150,157,164].map(y=>`<line x1="298" y1="${y}" x2="304" y2="${y}"/>`).join('')}</g>
    <circle cx="301" cy="179" r="10.5" fill="#C47A3A"/><circle cx="301" cy="195" r="13.5" fill="#C47A3A"/><rect x="292" y="180" width="18" height="12" fill="#C47A3A"/>
    <circle cx="301" cy="179" r="10.5" fill="url(#${u}gl)"/><circle cx="301" cy="195" r="13.5" fill="url(#${u}sd)"/>
    <circle cx="301" cy="186" r="4.6" fill="none" stroke="#E8C79A" stroke-width="1"/><circle cx="301" cy="186" r="3.8" fill="#2A1A0C"/>
    <rect x="295" y="199" width="12" height="3" rx="1" fill="#3A2412"/>
    <g stroke="#F3EEDF" stroke-width=".35">${[299.6,300.6,301.4,302.4].map(x=>`<line x1="${x}" y1="129" x2="${x}" y2="200"/>`).join('')}</g>`,
  dog:(u)=>`${SH(u,96,292,44,4.5,.3)}
    <path d="M62 266 q-15 -6 -10 -23" fill="none" stroke="#7E5530" stroke-width="5.5" stroke-linecap="round"/>
    <rect x="68" y="274" width="8" height="17" rx="3" fill="#8C5F34"/><rect x="100" y="274" width="8" height="17" rx="3" fill="#8C5F34"/>
    <ellipse cx="92" cy="268" rx="33" ry="15" fill="#A0703F"/>
    <ellipse cx="88" cy="262" rx="24" ry="6" fill="#000" opacity=".1"/><ellipse cx="96" cy="276" rx="20" ry="5" fill="#FFFFFF" opacity=".16"/>
    <rect x="76" y="276" width="8" height="16" rx="3" fill="#A0703F"/><rect x="110" y="276" width="8" height="16" rx="3" fill="#A0703F"/>
    <ellipse cx="80" cy="291" rx="5.5" ry="2" fill="#C2915C"/><ellipse cx="114" cy="291" rx="5.5" ry="2" fill="#C2915C"/>
    <circle cx="124" cy="252" r="13.5" fill="#A0703F"/>

  const lampOn=night&&s.extras.wall==='lamp';

const $=s=>document.querySelector(s);
const stage=$('#stage'),panel=$('#panel'),bar=$('#bar'),fill=$('#fill'),meta=$('#meta');
const now=new Date(),today=keyOf(now),num=puzzleNum(now),secs=SECS[now.getDay()];
let G=null,nextTimer=null;

const EYE_CLOSED=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M8 44 Q50 82 92 44" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><line x1="26" y1="60" x2="19" y2="72"/><line x1="50" y1="65" x2="50" y2="79"/><line x1="74" y1="60" x2="81" y2="72"/></g></svg>`;
function cover(text){stage.innerHTML=`<div class="cover">${EYE_CLOSED}<p>${text}</p></div>`;}
function yesterdayKey(){const d=new Date(now);d.setDate(d.getDate()-1);return keyOf(d);}
function streakText(st){return st.streak>0&&(st.last===today||st.last===yesterdayKey())?`🔥 ${st.streak}-day streak`:'';}

meta.textContent=`Room #${num}, ${DAYS[now.getDay()]}`;

function showStart(){
  G=null;bar.classList.remove('on');
  cover('Today’s room is ready.');
  const sk=streakText(store.load());
  panel.innerHTML=`<p class="lead">You’ll see the room once, for <strong>${secs} seconds</strong>. Then it’s gone, and you answer five questions about it. Last, the room comes back with one thing changed, and you tap what’s different.</p>
  ${sk?`<p class="small">${sk}</p>`:''}
  <div class="row"><button class="btn" id="go">Start looking</button></div>
  <p class="small">The look is longest on Mondays and gets shorter each day until Sunday.</p>`;
  $('#go').onclick=()=>begin('daily');
}

function begin(mode){
  clearInterval(nextTimer);
  const seed=mode==='daily'?'notice-'+today:'practice-'+Math.random();
  G={mode,game:buildGame(seed),secs:mode==='daily'?secs:10,picks:[],marks:[],idx:0};
  panel.innerHTML=`<p class="lead">Get ready to look.</p>`;
  let n=3;
  const tick=()=>{if(n===0){view();return;}stage.innerHTML=`<div class="count">${n}</div>`;n--;setTimeout(tick,800);};
  tick();
}

function view(){
  stage.innerHTML=sceneSVG(G.game.scene);
  panel.innerHTML=`<p class="lead">Look closely. Notice everything.</p>`;
  bar.classList.add('on');
  fill.style.transition='none';fill.style.width='100%';void fill.offsetWidth;
  fill.style.transition=`width ${G.secs}s linear`;fill.style.width='0%';
  setTimeout(()=>{bar.classList.remove('on');cover('Eyes closed. What did you see?');ask();},G.secs*1000);
}

function ask(){
  const q=G.game.questions[G.idx];
  panel.innerHTML=`<p class="qcount">Question ${G.idx+1} of 5</p><h2 class="qtext">${q.text}</h2>
  <div class="opts">${q.options.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b,q));
}

function choose(b,q){
  panel.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.answer)x.classList.add('correct');});
  const ok=b.dataset.v===q.answer;if(!ok)b.classList.add('wrong');
  G.picks.push(b.dataset.v);G.marks.push(ok?1:0);
  setTimeout(()=>{G.idx++;if(G.idx<5)ask();else spotIntro();},ok?550:1100);
}

const SPOT_SECS=20;
function spotIntro(){
  panel.innerHTML=`<p class="qcount">Final round</p><h2 class="qtext">Now one thing in the room has changed.</h2>
  <p class="lead">You get one tap to find it, and ${SPOT_SECS} seconds.</p>
  <div class="row"><button class="btn" id="spotgo">Show me the room</button></div>`;
  $('#spotgo').onclick=spot;
  $('#spotgo').focus();
}

function spot(){
  const ch=G.game.change;
  stage.innerHTML=sceneSVG(ch.scene);
  stage.classList.add('tap');
  panel.innerHTML=`<p class="qcount">Final round</p><h2 class="qtext">What changed? Tap it in the room.</h2>
  <div class="row"><button class="btn ghost" id="giveup">I can’t find it</button></div>`;
  bar.classList.add('on');
  fill.style.transition='none';fill.style.width='100%';void fill.offsetWidth;
  fill.style.transition=`width ${SPOT_SECS}s linear`;fill.style.width='0%';
  const svg=stage.querySelector('svg'),t0=performance.now();
  let done=false;
  const end=(pt,gaveUp)=>{
    if(done)return;done=true;clearTimeout(timer);
    const[x0,y0,x1,y1]=ch.box,pad=8;
    const found=!!pt&&pt.x>=x0-pad&&pt.x<=x1+pad&&pt.y>=y0-pad&&pt.y<=y1+pad;
    G.change={found,ms:Math.round(performance.now()-t0)};
    revealChange(svg,ch,pt);
    bar.classList.remove('on');stage.classList.remove('tap');
    panel.innerHTML=`<p class="qcount">Final round</p><h2 class="qtext">${found?`Spotted in ${(G.change.ms/1000).toFixed(1)} seconds.`:pt?'Not quite.':gaveUp?'Here’s what changed.':'Time’s up.'}</h2>
    <p class="lead">${ch.text}</p>
    <div class="row"><button class="btn" id="seeres">See your results</button></div>`;
    $('#seeres').onclick=finish;$('#seeres').focus();
  };
  const timer=setTimeout(()=>end(null),SPOT_SECS*1000);
  svg.addEventListener('pointerdown',e=>{
    const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    end(p.matrixTransform(svg.getScreenCTM().inverse()));
  });
  $('#giveup').onclick=()=>end(null,true);
}

function revealChange(svg,ch,pt){
  const[x0,y0,x1,y1]=ch.box,pad=5;
  let mark=`<rect x="${x0-pad}" y="${y0-pad}" width="${x1-x0+pad*2}" height="${y1-y0+pad*2}" rx="10" fill="none" stroke="#F2B33D" stroke-width="4" stroke-dasharray="9 6"/>`;
  if(pt&&!G.change.found)mark+=`<g stroke="#C4423A" stroke-width="4" stroke-linecap="round"><line x1="${pt.x-8}" y1="${pt.y-8}" x2="${pt.x+8}" y2="${pt.y+8}"/><line x1="${pt.x+8}" y1="${pt.y-8}" x2="${pt.x-8}" y2="${pt.y+8}"/></g>`;
  svg.insertAdjacentHTML('beforeend',mark);
}

function finish(){
  if(G.mode==='daily'){
    const st=store.load(),prev=st.history[today];
    if(!prev||!prev.v){
      if(st.last!==today)st.streak=st.last===yesterdayKey()?st.streak+1:1;
      st.last=today;st.history[today]={v:2,picks:G.picks,marks:G.marks,change:G.change};
      store.save(st);
    }
  }
  showResult();
}

function showResult(){
  const{game,picks,marks,mode}=G;
  const score=marks.reduce((a,b)=>a+b,0);
  stage.innerHTML=sceneSVG(game.scene);
  bar.classList.remove('on');
  const msgs=['The room kept all its secrets today.','The room kept most of its secrets today.','A few details slipped past you.','Good look. Some things blurred.','Almost everything. One detail got away.','Sharp eyes. Nothing got past you.'];
  const label=mode==='daily'?`Notice #${num}`:'Notice (practice)';
  const chg=G.change;
  const chgLine=chg.found?`🔍 Spotted the change in ${(chg.ms/1000).toFixed(1)}s`:'🙈 Missed the change';
  const share=`${label}\n${marks.map(m=>m?'✅':'❌').join('')} ${score}/5\n${chgLine}\n👁️ ${G.secs}-second look`;
  const sk=mode==='daily'?streakText(store.load()):'';
  panel.innerHTML=`<p class="score">${score}/5</p>
  <p class="marks" aria-hidden="true">${marks.map(m=>m?'✅':'❌').join('')}</p>
  <p class="msg">${msgs[score]}</p>
  <p class="small">${chgLine}</p>
  ${sk?`<p class="small">${sk}</p>`:''}
  <textarea class="share" id="share" rows="4" readonly aria-label="Your result to share">${share}</textarea>
  <div class="row"><button class="btn" id="copy">Copy result</button><button class="btn ghost" id="practice">Play a practice room</button></div>
  ${mode==='daily'?`<p class="small" id="next"></p>`:`<div class="row"><button class="btn ghost" id="back">Back to today’s room</button></div>`}
  <p class="small">Here’s the room again. Check your answers against it.</p>
  <ul class="review">${game.questions.map((q,i)=>`<li><span class="q">${marks[i]?'✅':'❌'} ${q.text}</span><br><span class="a">${marks[i]?`You said ${picks[i]}.`:`You said ${picks[i]}. It was ${q.answer}.`}</span></li>`).join('')}
  <li><span class="q">${chg.found?'✅':'❌'} What changed?</span><br><span class="a">${game.change.text}</span></li></ul>`;
  const btn=$('#copy'),ta=$('#share');
  btn.onclick=async()=>{
    try{await navigator.clipboard.writeText(share);btn.textContent='Copied';}
    catch(e){ta.select();try{document.execCommand('copy');btn.textContent='Copied';}catch(e2){btn.textContent='Select the text to copy';}}
    setTimeout(()=>btn.textContent='Copy result',1800);
  };
  $('#practice').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});begin('practice');};
  if(mode==='daily'){
    const upd=()=>{const m=new Date();const mid=new Date(m.getFullYear(),m.getMonth(),m.getDate()+1);const diff=mid-m;const h=Math.floor(diff/36e5),mi=Math.floor(diff%36e5/6e4);const el=$('#next');if(el)el.textContent=`Next room in ${h}h ${mi}m.`;};
    upd();clearInterval(nextTimer);nextTimer=setInterval(upd,30000);
  }else{
    $('#back').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});load();};
  }
}

function load(){
  const h=store.load().history[today];
  // Entries saved before the final round existed (no v) can't be replayed against the new room, so today is offered fresh.
  if(h&&h.v===2){G={mode:'daily',game:buildGame('notice-'+today),secs,picks:h.picks,marks:h.marks,change:h.change,idx:5};showResult();}
  else showStart();
}
load();
</script>
